[package]
name = "ai-worker-tauri"
version = "0.1.2"
description = "AI-Worker Tauri desktop host"
authors = ["AI-Worker Team"]
edition = "2021"
rust-version = "1.90"

[features]
proof = []
history-proof = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.2", features = [] }
serde_json = "=1.0.151"
tauri-plugin-store = "=2.5.0"

[dev-dependencies]
tauri = { version = "=2.12.2", features = ["test"] }
