[package]
name = "ai-worker-tauri"
version = "0.1.2"
description = "AI-Worker Tauri desktop host"
authors = ["AI-Worker Team"]
edition = "2021"
rust-version = "1.90"

[features]
proof = []
history-proof = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
getrandom = "=0.3.4"
httparse = "=1.10.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["net", "sync", "time"] }
webpki-root-certs = "=1.0.9"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
serde_json = "=1.0.151"
tauri-plugin-store = "=2.5.0"
tauri-plugin-dialog = "=2.6.0"
sha2 = "=0.10.9"
sysinfo = "=0.33.1"
rusqlite = { version = "=0.39.0", features = ["bundled"] }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tauri = { version = "=2.12.2", features = ["test"] }
