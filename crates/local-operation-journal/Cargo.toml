[package]
name = "local-operation-journal"
version = "0.1.0"
edition = "2024"
description = "Embedded SQLite journal for reviewed operations and explicit crash reconciliation"
license = "MIT"
repository = "https://github.com/meharajM/ai-worker-desktop"
readme = "README.md"
keywords = ["sqlite", "journal", "recovery", "local-first"]
categories = ["database", "embedded"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
bundled = ["rusqlite/bundled"]

[dependencies]
rusqlite = "0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
