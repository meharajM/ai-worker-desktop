name: Tauri installers

on:
  push:
    tags:
      - 'tauri-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macOS Apple silicon
            bundle: dmg
            asset: AI-Worker-macos-arm64.dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macOS Intel
            bundle: dmg
            asset: AI-Worker-macos-x64.dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x64
            bundle: appimage
            asset: AI-Worker-linux-x64.AppImage
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux ARM64
            bundle: appimage
            asset: AI-Worker-linux-arm64.AppImage
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64
            bundle: nsis
            asset: AI-Worker-windows-x64-setup.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and attach platform package
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_WORKER_TARGET_TRIPLE: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: npm run tauri --
          tagName: tauri-v__VERSION__
          releaseName: AI-Worker Tauri __VERSION__
          releaseBody: Platform installers for the Tauri desktop app. Download the file for your operating system and architecture, then follow the getting-started guide.
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: '[name]-[bundle]-[arch][setup].[ext]'
          args: --target ${{ matrix.target }}

      - name: Upload stable installer name and checksum (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          source_file="$(find "src-tauri/target/${TARGET}/release/bundle/${BUNDLE}" -type f \( -name '*.dmg' -o -name '*.AppImage' \) -print -quit)"
          test -n "$source_file"
          cp "$source_file" "$ASSET"
          if command -v shasum >/dev/null 2>&1; then
            digest="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          else
            digest="$(sha256sum "$ASSET" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$digest" "$ASSET" > "${ASSET}.sha256"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "${ASSET}.sha256" --clobber

      - name: Upload stable installer name and checksum (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
          ASSET: ${{ matrix.asset }}
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/$env:TARGET/release/bundle/$env:BUNDLE"
          $source = Get-ChildItem -Path $bundlePath -Filter '*.exe' -File | Select-Object -First 1
          if (-not $source) { throw "No NSIS installer was created in $bundlePath" }
          Copy-Item $source.FullName $env:ASSET
          $digest = (Get-FileHash -Path $env:ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $env:ASSET" | Set-Content -NoNewline -Path "$env:ASSET.sha256"
          gh release upload $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" --clobber

  publish-install-manifest:
    name: Publish installer manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Create installer manifest
        run: |
          cat > install-manifest.txt <<'MANIFEST'
          macos-arm64=AI-Worker-macos-arm64.dmg
          macos-x64=AI-Worker-macos-x64.dmg
          linux-arm64=AI-Worker-linux-arm64.AppImage
          linux-x64=AI-Worker-linux-x64.AppImage
          windows-x64=AI-Worker-windows-x64-setup.exe
          MANIFEST

      - name: Attach installer manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" install-manifest.txt --clobber
