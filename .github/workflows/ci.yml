name: CI

on:
  push:
    branches: [ main, prod ]
  pull_request:
    branches: [ main, prod ]
    types: [opened, synchronize]

jobs:
  chat:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Web chat checks
        run: |
          npm run web:typecheck
          npm run web:build
          npm run web:proof-build

      - name: Focused Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          npm run test:rust:chat
          npm run test:rust:proof
